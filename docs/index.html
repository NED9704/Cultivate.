<style>

  }

  nav a { color:var(--soft); margin-right:20px; }
  h1 { color:var(--text); font-size:30px; line-height:1.2; margin:0 0 16px; }
  h2 { color:var(--text); font-size:20px; margin:32px 0 8px; }
  a { color:var(--accent); }
